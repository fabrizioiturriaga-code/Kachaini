<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <body>
    <svg th:fragment="iconos" width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="n-inicio" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="n-retos" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></symbol>
      <symbol id="n-comunidad" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
      <symbol id="n-avisos" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
      <symbol id="n-mensajes" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7.5l8 6 8-6"/></symbol>
      <symbol id="n-perfil" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="2" fill="currentColor" stroke="none"/></symbol>
      <symbol id="n-progreso" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
      <symbol id="n-multiplicador" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7L12 3z"/></symbol>
      <symbol id="n-unidades" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></symbol>
      <symbol id="n-reportes" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></symbol>
      <symbol id="n-clave" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
      <symbol id="n-salir" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></symbol>
    </svg>

    <div th:fragment="usuario" class="barra-inferior__usuario" th:if="${usuarioActual != null}">
      <div class="barra-inferior__quien">
        <span class="barra-inferior__avatar" aria-hidden="true"
              th:text="${usuarioActual.avatar != null} ? ${usuarioActual.avatar} : (${usuarioActual.rol.name() == 'DOCENTE'} ? '🧑‍🏫' : '✨')">✨</span>
        <div class="barra-inferior__datos">
          <span class="barra-inferior__nombre" th:text="${usuarioActual.nombre}">Nombre</span>
          <span class="barra-inferior__rol" th:text="${usuarioActual.rol.name() == 'DOCENTE'} ? 'Docente' : 'Estudiante'">Estudiante</span>
        </div>
      </div>
      <form method="post" th:action="@{/logout}">
        <button type="submit" class="barra-inferior__salir">
          <svg class="barra-inferior__svg"><use href="#n-salir"/></svg>Cerrar sesión
        </button>
      </form>
    </div>

    <nav th:fragment="barra(activo)" class="barra-inferior" aria-label="Navegación principal">
      <svg th:replace="~{fragments/navegacion :: iconos}"></svg>
      <a class="barra-inferior__marca" th:href="@{/inicio}" aria-label="Kaichaini, ir al inicio">
        <img th:src="@{/img/logo-kaichaini.png}" alt="Logo de Kaichaini">
      </a>
      <a th:href="@{/inicio}" class="barra-inferior__enlace"
         th:classappend="${activo == 'inicio'} ? 'barra-inferior__enlace--activo'"
         th:attr="aria-current=${activo == 'inicio'} ? 'page'">
        <span class="barra-inferior__icono" aria-hidden="true"><svg class="barra-inferior__svg"><use href="#n-inicio"/></svg></span>
        <span class="barra-inferior__texto">Inicio</span>
      </a>
      <a th:href="@{/estudiante/retos}" class="barra-inferior__enlace"
         th:classappend="${activo == 'retos'} ? 'barra-inferior__enlace--activo'"
         th:attr="aria-current=${activo == 'retos'} ? 'page'">
        <span class="barra-inferior__icono" aria-hidden="true"><svg class="barra-inferior__svg"><use href="#n-retos"/></svg></span>
        <span class="barra-inferior__texto">Retos</span>
      </a>
      <a th:href="@{/estudiante/comunidad}" class="barra-inferior__enlace"
         th:classappend="${activo == 'comunidad'} ? 'barra-inferior__enlace--activo'"
         th:attr="aria-current=${activo == 'comunidad'} ? 'page'">
        <span class="barra-inferior__icono" aria-hidden="true"><svg class="barra-inferior__svg"><use href="#n-comunidad"/></svg></span>
        <span class="barra-inferior__texto">Comunidad</span>
      </a>
      <a th:href="@{/estudiante/avisos}" class="barra-inferior__enlace"
         th:classappend="${activo == 'avisos'} ? 'barra-inferior__enlace--activo'"
         th:attr="aria-current=${activo == 'avisos'} ? 'page'">
        <span class="barra-inferior__icono" aria-hidden="true"><svg class="barra-inferior__svg"><use href="#n-avisos"/></svg></span>
        <span class="barra-inferior__texto">Avisos</span>
        <span class="barra-inferior__contador"
          th:if="${resumenAvisos != null and resumenAvisos.nuevos() > 0}"
          th:text="${resumenAvisos.nuevos()}"
          th:attr="aria-label=|${resumenAvisos.nuevos()} sin leer|">1</span>
      </a>
      <a th:href="@{/estudiante/mensajes}" class="barra-inferior__enlace"
         th:classappend="${activo == 'mensajes'} ? 'barra-inferior__enlace--activo'"
         th:attr="aria-current=${activo == 'mensajes'} ? 'page'">
        <span class="barra-inferior__icono" aria-hidden="true"><svg class="barra-inferior__svg"><use href="#n-mensajes"/></svg></span>
        <span class="barra-inferior__texto">Mensajes</span>
        <span class="barra-inferior__contador"
          th:if="${mensajesSinLeer != null and mensajesSinLeer > 0}"
          th:text="${mensajesSinLeer}"
          th:attr="aria-label=|${mensajesSinLeer} sin leer|">1</span>
      </a>
      <a th:href="@{/estudiante/perfil}" class="barra-inferior__enlace"
         th:classappend="${activo == 'perfil'} ? 'barra-inferior__enlace--activo'"
         th:attr="aria-current=${activo == 'perfil'} ? 'page'">
        <span class="barra-inferior__icono" aria-hidden="true"><svg class="barra-inferior__svg"><use href="#n-perfil"/></svg></span>
        <span class="barra-inferior__texto">Perfil</span>
      </a>
      <div th:replace="~{fragments/navegacion :: usuario}"></div>
    </nav>
  </body>
</html>
