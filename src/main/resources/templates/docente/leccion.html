<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Editar lección · Kaichaini</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" th:href="@{/css/docente.css}">
    <link rel="stylesheet" th:href="@{/css/avisos.css}">
  </head>
  <body class="con-barra-inferior">
    <main>
      <p><a th:href="@{/docente/unidades/{id}(id=${unidad.id})}" th:text="|← Volver a ${unidad.titulo}|">← Volver</a></p>
      <h1 th:text="|Editar lección ${orden}|">Editar lección</h1>
      <p role="alert" th:if="${error}" th:text="${error}"></p>
      <form method="post" class="formulario-reto"
            th:action="@{/docente/unidades/{id}/lecciones/{l}(id=${unidad.id},l=${leccionId})}">
        <th:block th:replace="~{fragments/leccion-docente :: campos(${leccion}, 'editar')}"></th:block>
        <button type="submit">Guardar lección</button>
      </form>
    </main>
    <nav th:replace="~{fragments/navegacion-docente :: barra('unidades')}"></nav>
  </body>
</html>
