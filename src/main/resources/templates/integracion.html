<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sesión · Kaichaini</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
  </head>
  <body>
    <main>
      <h1>Sesión iniciada</h1>
      <p th:text="${usuario.nombre}">
      </p>
      <p th:text="${usuario.rol}">
      </p>
      <p>Destino temporal de integración. El onboarding, inicio y panel docente pertenecen a historias futuras.</p>
      <section th:if="${usuario.rol.name() == 'DOCENTE'}" aria-labelledby="titulo-panel-docente">
        <h2 id="titulo-panel-docente">Panel docente</h2>
        <ul>
          <li><a th:href="@{/docente/progreso}">📊 Progreso de estudiantes</a></li>
          <li><a th:href="@{/docente/multiplicadores}">✨ Multiplicadores de XP</a></li>
        </ul>
      </section>
      <a th:if="${usuario.rol.name() == 'ESTUDIANTE'}" th:href="@{/estudiante/perfil}">Mi perfil</a>
      <a th:href="@{/cuenta/contrasena}">Cambiar contraseña</a>
      <form method="post" th:action="@{/logout}">
        <button type="submit">Cerrar sesión</button>
      </form>
    </main>
  </body>
</html>
