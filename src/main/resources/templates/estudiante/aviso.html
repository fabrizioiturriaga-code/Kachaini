<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title th:text="|${aviso.reto().titulo} · Kaichaini|">Reto · Kaichaini</title>
    <link rel="icon" type="image/png" th:href="@{/img/kai.png}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" th:href="@{/css/avisos.css}">
  </head>
  <body class="con-barra-inferior">
    <main>
      <p><a th:href="@{/estudiante/avisos}">← Volver a avisos</a></p>
      <h1 th:text="${aviso.reto().titulo}">Reto</h1>
      <p role="status" th:if="${mensaje}" th:text="${mensaje}"></p>
      <p role="alert" th:if="${error}" th:text="${error}"></p>
      <p>
        <span class="etiqueta etiqueta--completado" th:if="${aviso.completado()}">✅ Completado</span>
        <span class="etiqueta etiqueta--vencido" th:if="${aviso.fallido()}">❌ No logrado</span>
        <span class="etiqueta" th:unless="${aviso.completado() or aviso.fallido()}"
              th:classappend="${aviso.isVencido()} ? 'etiqueta--vencido' : (${aviso.isPorVencer()} ? 'etiqueta--por-vencer' : 'etiqueta--nuevo')"
              th:text="${aviso.estado().etiqueta}">Vigente</span>
      </p>
      <dl class="reto-detalle">
        <dt>Descripción</dt>
        <dd th:text="${aviso.reto().descripcion}">Descripción</dd>
        <dt>Objetivos</dt>
        <dd>
          <ul>
            <li th:each="objetivo : ${aviso.reto().listaObjetivos}" th:text="${objetivo}">Objetivo</li>
          </ul>
        </dd>
        <dt>Fecha límite</dt>
        <dd th:text="${aviso.reto().fechaLimiteTexto}">01/01/2026</dd>
        <dt>Recompensa</dt>
        <dd th:text="|${aviso.reto().xp} XP|">20 XP</dd>
      </dl>
      <form method="post" class="boton-completar" th:if="${aviso.isPuedeCompletarse()}"
            th:action="@{/estudiante/avisos/{id}/completar(id=${aviso.reto().id})}">
        <fieldset class="pregunta-reto" th:if="${aviso.reto().conPregunta}">
          <legend th:text="${aviso.reto().pregunta}">Pregunta</legend>
          <p class="ayuda">Tienes un solo intento.</p>
          <label class="opcion" th:each="opcion, estado : ${aviso.reto().listaOpciones}">
            <input type="radio" name="respuesta" required th:value="${estado.index}">
            <span th:text="${opcion}">Opción</span>
          </label>
        </fieldset>
        <button type="submit"
                th:text="${aviso.reto().conPregunta} ? 'Enviar respuesta' : '✅ Marcar como completado'">✅ Marcar como completado</button>
      </form>
      <p th:if="${aviso.fallido()}">Tu respuesta no fue correcta. Este reto ya no se puede completar.</p>
      <p th:if="${aviso.isVencido()}">Este reto ya venció, ya no se puede completar.</p>
    </main>
    <nav th:replace="~{fragments/navegacion :: barra('avisos')}"></nav>
  </body>
</html>
