<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Retos · Kaichaini</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
  </head>
  <body class="con-barra-inferior">
    <main>
      <h1><span aria-hidden="true">🎯</span> Retos</h1>
      <section aria-labelledby="titulo-logros">
        <h2 id="titulo-logros">Mis logros</h2>
        <p>XP acumulada: <strong th:text="${progreso.xp()}">0</strong></p>
        <ul>
          <li th:each="logro : ${catalogoLogros}">
            <span aria-hidden="true" th:text="${progreso.tieneLogro(logro)} ? ${logro.icono} : '🔒'"></span>
            <strong th:text="${logro.nombre}">Logro</strong>:
            <span th:text="${logro.descripcion}"></span>
            <span th:text="${progreso.tieneLogro(logro)} ? '(Obtenido)' : '(Por desbloquear)'"></span>
          </li>
        </ul>
      </section>
      <p th:unless="${progreso.completado()}">
        <a th:href="@{/onboarding}">Continúa el módulo inicial</a> para ganar más XP e insignias.
      </p>
    </main>
    <nav th:replace="~{fragments/navegacion :: barra('retos')}"></nav>
  </body>
</html>
