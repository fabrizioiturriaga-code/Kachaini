<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Retos · Kaichaini</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" th:href="@{/css/logros.css}">
  </head>
  <body class="con-barra-inferior">
    <main>
      <h1><span aria-hidden="true">🎯</span> Retos</h1>
      <section aria-labelledby="titulo-coleccion">
        <h2 id="titulo-coleccion">Mi colección</h2>
        <p>
          XP acumulada: <strong th:text="${progreso.xp()}">0</strong>
          · Insignias: <strong th:text="|${progreso.logros().size()} de ${catalogoLogros.size()}|">0 de 0</strong>
        </p>
        <ul class="coleccion">
          <li th:each="logro : ${catalogoLogros}"
              th:with="obtenido=${progreso.tieneLogro(logro)}"
              class="insignia"
              th:classappend="${obtenido} ? 'insignia--obtenida' : 'insignia--bloqueada'">
            <span class="insignia__icono" aria-hidden="true"
                  th:text="${obtenido} ? ${logro.icono} : '🔒'">🏅</span>
            <strong th:text="${logro.nombre}">Logro</strong>
            <span class="insignia__estado" th:text="${obtenido} ? 'Obtenido' : 'Bloqueado'"></span>
            <p class="insignia__descripcion" th:if="${obtenido}" th:text="${logro.descripcion}"></p>
            <p class="insignia__como" th:unless="${obtenido}">
              <strong>Cómo conseguirlo:</strong> <span th:text="${logro.comoConseguirlo}"></span>
            </p>
          </li>
        </ul>
      </section>
      <p th:unless="${progreso.completado()}">
        <a th:href="@{/onboarding}">Continúa el módulo inicial</a> para ganar más XP e insignias.
      </p>
    </main>
    <nav th:replace="~{fragments/navegacion :: barra('retos')}"></nav>
  </body>
</html>
