<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Inicio · Kaichaini</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
    <link rel="stylesheet" th:href="@{/css/mapa.css}">
  </head>
  <body class="con-barra-inferior">
    <main>
      <h1><span class="saludo__avatar" aria-hidden="true" th:if="${avatarSesion}"
                th:text="${avatarSesion}">✨</span>
        ¡Hola, <span th:text="${nombre}">estudiante</span>!</h1>
      <p role="status" th:if="${mensaje}" th:text="${mensaje}"></p>
      <p role="alert" th:if="${error}" th:text="${error}"></p>
      <p role="status" th:each="aviso : ${notificaciones}" th:text="${aviso}"></p>
      <div th:replace="~{fragments/energia :: barra(${energia})}"></div>
      <div th:replace="~{fragments/racha :: contador(${diasRacha}, false)}"></div>
      <section aria-labelledby="titulo-mapa">
        <h2 id="titulo-mapa">Mapa de misiones</h2>
        <p th:if="${unidadActiva}">
          Continúa con la unidad
          <strong th:text="|${unidadActiva.numero()}. ${unidadActiva.titulo()}|"></strong>.
        </p>
        <ol class="mapa-misiones">
          <li th:each="unidad : ${unidades}" class="unidad" th:classappend="${unidad.claseCss()}"
              th:attr="aria-current=${unidad.isActiva()} ? 'step'">
            <span class="unidad__numero" th:text="${unidad.numero()}">1</span>
            <div class="unidad__cuerpo">
              <p class="unidad__titulo">
                <a th:if="${!unidad.isBloqueada()}" th:href="@{/estudiante/unidades/{n}(n=${unidad.numero()})}"
                   th:text="${unidad.titulo()}">Unidad</a>
                <span th:if="${unidad.isBloqueada()}" th:text="${unidad.titulo()}">Unidad</span>
              </p>
              <p class="unidad__estado"
                 th:text="${unidad.isActiva()} ? 'En progreso' : (${unidad.isBloqueada()} ? '🔒 Bloqueada' : '✅ Completada')">
              </p>
              <progress class="unidad__progreso" max="100" th:value="${unidad.porcentaje()}"
                        th:attr="aria-label=|Progreso de la unidad ${unidad.numero()}|"
                        th:text="|${unidad.porcentaje()}%|">0%</progress>
              <p class="unidad__estrellas"
                 th:attr="aria-label=|${unidad.leccionesCompletadas()} de ${unidad.leccionesTotal()} lecciones completadas|"
                 th:text="${unidad.estrellas()}">☆☆☆</p>
            </div>
          </li>
        </ol>
        <p><a th:href="@{/onboarding}">Repasar el módulo inicial</a></p>
      </section>
      <section aria-labelledby="titulo-practica">
        <h2 id="titulo-practica">Práctica</h2>
        <ul class="accesos">
          <li><a th:href="@{/estudiante/lecturas}">📖 Lecturas</a></li>
          <li><a th:href="@{/estudiante/arrastre}">🧩 Arrastrar y soltar</a></li>
        </ul>
      </section>
    </main>
    <nav th:replace="~{fragments/navegacion :: barra('inicio')}"></nav>
  </body>
</html>
