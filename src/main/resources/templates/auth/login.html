<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ingresar · Kaichaini</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <script defer th:src="@{/js/auth.js}">
    </script>
  </head>
  <body>
    <main>
      <h1>Kaichaini</h1>
      <h2>Iniciar sesión</h2>
      <p role="status" th:if="${mensaje}" th:text="${mensaje}">
      </p>
      <p id="error-login" role="alert" tabindex="-1" th:if="${param.error}">Correo o contraseña incorrectos</p>
      <p role="alert" th:if="${param.revocada}">Tu sesión dejó de estar autorizada. Comunícate con la institución.</p>
      <p role="status" th:if="${param.logout}">Sesión cerrada.</p>
      <form method="post" th:action="@{/login}">
        <label for="correo">Correo</label>
        <input id="correo" name="correo" th:attr="aria-invalid=${errorLogin},aria-describedby=${errorLogin ? 'error-login' : null}" type="email" required maxlength="254" autocomplete="username">
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="contrasena" th:attr="aria-invalid=${errorLogin},aria-describedby=${errorLogin ? 'error-login' : null}" type="password" required autocomplete="current-password">
        <button type="button" data-password="contrasena" aria-pressed="false">Mostrar contraseña</button>
        <button type="submit">Ingresar</button>
      </form>
      <a th:href="@{/registro}">Crear una cuenta</a>
    </main>
  </body>
</html>
