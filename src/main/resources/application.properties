spring.application.name=kaichaini
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kaichaini}
spring.datasource.username=${DB_USERNAME:kaichaini_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
kaichaini.institutional-domains=${INSTITUTIONAL_DOMAINS:}
spring.messages.encoding=UTF-8
kaichaini.login.max-intentos=${LOGIN_MAX_INTENTOS:5}
kaichaini.login.espera-segundos=${LOGIN_ESPERA_SEGUNDOS:60}
