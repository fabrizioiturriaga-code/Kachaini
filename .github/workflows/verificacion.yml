name: Verificación
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kaichaini_test
          POSTGRES_USER: kaichaini_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_POSTGRES_TESTS: 'true'
      TEST_DB_URL: jdbc:postgresql://localhost:5432/kaichaini_test
      TEST_DB_USERNAME: kaichaini_test
      TEST_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y ejecutar todas las pruebas
        run: bash mvnw --batch-mode --no-transfer-progress verify
