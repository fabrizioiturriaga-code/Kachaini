services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kaichaini
      POSTGRES_USER: ${DB_USERNAME:-kaichaini_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD para iniciar PostgreSQL}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
